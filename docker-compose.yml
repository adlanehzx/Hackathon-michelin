version: "3.8"

services:
  backend:
    build: ./backend
    container_name: michelin-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
    ports:
      - "3000:3000"

    networks:
      - michelin-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: michelin-frontend
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/app.json:/app/app.json
      - ./frontend/App.tsx:/app/App.tsx
      - ./frontend/index.js:/app/index.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/package.json:/app/package.json
    networks:
      - michelin-network
    depends_on:
      - backend
    environment:
      - EXPO_DEBUG=true
    restart: on-failure

networks:
  michelin-network:
    driver: bridge
