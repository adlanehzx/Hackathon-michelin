services:
  backend:
    build:
      context: ./backend
      target: dev
    container_name: michelin-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/.env:/app/.env
    networks:
      - michelin-network

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: michelin-frontend-web
    command: npm run web
    ports:
      - "19006:19006"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/assets:/app/assets
      - ./frontend/app.json:/app/app.json
      - ./frontend/App.tsx:/app/App.tsx
      - ./frontend/index.js:/app/index.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/declarations.d.ts:/app/declarations.d.ts
      - ./frontend/package.json:/app/package.json
      - ./frontend/.env:/app/.env
    depends_on:
      - backend
    networks:
      - michelin-network
    environment:
      - EXPO_DEBUG=true
    restart: on-failure

  frontend-go:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: michelin-frontend-go
    command: npm run go
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/assets:/app/assets
      - ./frontend/app.json:/app/app.json
      - ./frontend/App.tsx:/app/App.tsx
      - ./frontend/index.js:/app/index.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/declarations.d.ts:/app/declarations.d.ts
      - ./frontend/package.json:/app/package.json
      - ./frontend/.env:/app/.env
    depends_on:
      - backend
    networks:
      - michelin-network
    environment:
      - EXPO_DEBUG=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=172.20.10.2
    restart: on-failure

networks:
  michelin-network:
    driver: bridge
